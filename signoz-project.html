
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Monitoring Project</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5ff;
            text-align: center;
        }
        header {
            background: #273c75;
            color: white;
            padding: 25px;
        }
        main {
            margin: 80px auto;
            padding: 35px;
            max-width: 600px;
            background: white;

        }
        button {

            color: white;
            border: none;

<header>
    <h1>My First AWS Website</h1>
    <p>Website Monitoring Project</p>
</header>

    <button onclick="alert('Website is working!')">
        Test Website
    </button>
</main>

<footer>
    <p>My DevOps Practice Project - 2026</p>
</footer>

</html>
